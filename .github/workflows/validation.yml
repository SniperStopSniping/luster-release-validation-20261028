name: Exact 1e3f official TypeScript validation
# Bounded approved continuation:733 seconds used; this job at most120seconds.
# Driver default branch holds only driver + reviewed snapshot pack/manifest.
# Snapshot contains exact candidate commit and its tree/blobs, NO parent objects.
# Never push into SniperStopSniping/nailsalon. Dispatch default only.
# A temporary repo does NOT prove Vercel/GitHub Apps/secrets isolation; review that
# independently before publishing. Actions availability/security/costs unverified.
# Node Linux/amd64 manifest/config digest content chain independently reviewed
# from official anonymous registry metadata (Node 24.22.1); image layers/runtime
# are NOT verified. Actions v4 refs below are pinned to commits resolved from
# official GitHub metadata; this is not action security/runtime approval.
# Forced runner cancellation/SIGKILL may bypass EXIT cleanup. Writable install
# mounts and PostgreSQL/tmpfs storage lack a proven disk ceiling; only host
# preflight free space is checked. Equal memory-swap requests no container swap,
# but runner/kernel support and enforcement are unverified execution gates.
# Two-phase install then network-none rebuild/explicit root prepare is a NEW
# isolated method, not equivalent evidence to original npm ci lifecycle ordering.
# Pinned-image npm behavior/native probes/full suites remain UNVERIFIED.
# Sequential rebuild/native probes are required execution gates, no fallback.
# Real .git metadata is masked by empty read-only tmpfs in EVERY subject-mounted
# container. Docker masking effectiveness remains an unexecuted runtime gate.
# Host Git uses a scrubbed environment and disables fsmonitor/hooks/helpers.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUBJECT_SHA: '1e3f8ab740aaf134e3a33af31b260c3c3a53080f'
      NODE_IMAGE: 'node:24-bookworm-slim@sha256:e1582112fb9f152ed38eefcd712efc93fee1becb519fdfa57574d5e07eaa5e7d'
      PG_IMAGE: 'mirror.gcr.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea'
    steps:
      - name: Require exact isolated driver repository and default branch
        env:
          DRIVER_REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$DRIVER_REPOSITORY" = 'SniperStopSniping/luster-release-validation-20261028'
          test "$DISPATCH_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$DEFAULT_BRANCH" != 'subject'
          [[ "$NODE_IMAGE" =~ ^node:24-bookworm-slim@sha256:[a-f0-9]{64}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (official tag resolved read-only)
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - name: Reconstruct exact single-commit combined candidate from reviewed public inputs
        run: |
          set -euo pipefail
          printf '%s  %s\n' ec7e615f821b9272334b66fa7ada7e4e59bf24831053eec9b036648085cb6e97 driver/reconstruct-subject.sh | sha256sum --check
          bash driver/reconstruct-subject.sh "$GITHUB_WORKSPACE/driver" "$GITHUB_WORKSPACE/subject"
      - name: Freeze clean exact subject and check host resources
        working-directory: subject
        run: |
          set -euo pipefail
          assert_git_metadata() {
            test -d .git && test ! -L .git
            test -f .git/config && test ! -L .git/config
            test -f .git/HEAD && test ! -L .git/HEAD
            test ! -e .git/commondir
            test ! -e .git/worktrees
            test ! -e .git/objects/info/alternates
          }
          safe_git() {
            env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/host-git-home" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_COUNT=0 GIT_OPTIONAL_LOCKS=0 /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c core.attributesFile=/dev/null -c core.pager=cat -c credential.helper= -c diff.external= "$@"
          }
          assert_git_metadata
          test "$(safe_git rev-parse HEAD)" = "$SUBJECT_SHA"
          test -z "$(safe_git status --porcelain)"
          sha256sum package.json package-lock.json > "$RUNNER_TEMP/booking-inputs.sha256"
          safe_git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/booking-source.sha256"
          sha256sum .git/config .git/HEAD .git/shallow > "$RUNNER_TEMP/booking-git-metadata.sha256"
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -ge 3145728
          test "$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)" -ge 6291456
      - name: Run official TypeScript validation without provider access
        working-directory: subject
        run: |
          set -euo pipefail
          assert_git_metadata() {
            test -d .git && test ! -L .git
            test -f .git/config && test ! -L .git/config
            test -f .git/HEAD && test ! -L .git/HEAD
            test ! -e .git/commondir
            test ! -e .git/worktrees
            test ! -e .git/objects/info/alternates
          }
          safe_git() {
            env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/host-git-home" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_COUNT=0 GIT_OPTIONAL_LOCKS=0 /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c core.attributesFile=/dev/null -c core.pager=cat -c credential.helper= -c diff.external= "$@"
          }
          assert_git_metadata
          owned="$RUNNER_TEMP/booking-owned"
          results="$RUNNER_TEMP/booking-results"
          mkdir "$owned" "$results"
          owner="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            original_exit=$?
            cleanup_failed=0
            for file in "$owned"/*.cid; do
              test -e "$file" || continue
              cid="$(cat "$file")"
              if [[ ! "$cid" =~ ^[a-f0-9]{64}$ ]]; then cleanup_failed=1; continue; fi
              if ! ids="$(timeout 15s docker ps -aq --no-trunc)"; then cleanup_failed=1; continue; fi
              if printf '%s\n' "$ids" | grep -Fqx "$cid"; then
                if ! label="$(timeout 15s docker inspect --format '{{index .Config.Labels "luster-driver-owner"}}' "$cid")"; then cleanup_failed=1; continue; fi
                if test "$label" != "$owner"; then cleanup_failed=1; continue; fi
                if test "$original_exit" != 0 && test "$file" = "$owned/pg.cid"; then
                  timeout 5s docker inspect --format '{{json .State}}' "$cid" || true
                  timeout 5s docker logs --tail 80 "$cid" || true
                fi
                if ! timeout 15s docker rm -f "$cid"; then cleanup_failed=1; fi
              fi
              if ! ids="$(timeout 15s docker ps -aq --no-trunc)"; then cleanup_failed=1; continue; fi
              if printf '%s\n' "$ids" | grep -Fqx "$cid"; then cleanup_failed=1; fi
            done
            printf 'owned_container_cleanup_failed=%s\n' "$cleanup_failed"
            if test "$cleanup_failed" != 0; then exit 1; fi
            exit "$original_exit"
          }
          trap cleanup EXIT
          timeout 120s docker pull "$NODE_IMAGE"
          # Install does not execute subject/dependency lifecycle scripts. No host
          # home, credentials, Docker socket or Actions runtime env enters it.
          assert_git_metadata
          timeout 240s docker run --user "$(id -u):$(id -g)" --rm --cidfile "$owned/install.cid" --label "luster-driver-owner=$owner" --memory=2g --memory-swap=2g --cpus=2 --pids-limit=256 --cap-drop=ALL --security-opt=no-new-privileges --mount "type=bind,src=$PWD,dst=/subject" --tmpfs /subject/.git:ro,noexec,nosuid,nodev,mode=000 -w /subject -e CI=true -e HUSKY=0 -e HOME=/tmp/isolated-home -e NPM_CONFIG_CACHE=/tmp/isolated-npm-cache -e NPM_CONFIG_USERCONFIG=/tmp/empty-user.npmrc -e NPM_CONFIG_GLOBALCONFIG=/tmp/empty-global.npmrc "$NODE_IMAGE" bash -euo pipefail -c 'test ! -e /subject/.git/HEAD; test ! -e /subject/.git/config; mkdir -p "$HOME" "$NPM_CONFIG_CACHE"; touch /tmp/empty-user.npmrc /tmp/empty-global.npmrc; npm ci --ignore-scripts --no-audit --no-fund'
          assert_git_metadata
          sha256sum --check "$RUNNER_TEMP/booking-git-metadata.sha256"
          sha256sum --check "$RUNNER_TEMP/booking-inputs.sha256"
          # Standalone lifecycle namespace BEFORE any PG creation/access. Only
          # subject mount: no results/driver, home, credentials or Docker socket.
          # --offline is not the boundary: namespace none blocks direct fetches
          # and child npm/download fallbacks as well. Any failure stops here.
          assert_git_metadata
          timeout 180s docker run --user "$(id -u):$(id -g)" -i --rm --cidfile "$owned/rebuild.cid" --label "luster-driver-owner=$owner" --network=none --cap-drop=ALL --security-opt=no-new-privileges --read-only --tmpfs /tmp:rw --memory=2g --memory-swap=2g --cpus=2 --pids-limit=256 --mount "type=bind,src=$PWD,dst=/subject" --tmpfs /subject/.git:ro,noexec,nosuid,nodev,mode=000 -w /subject -e CI=true -e HUSKY=0 -e HOME=/tmp/isolated-home -e NPM_CONFIG_CACHE=/tmp/isolated-npm-cache -e NPM_CONFIG_USERCONFIG=/tmp/empty-user.npmrc -e NPM_CONFIG_GLOBALCONFIG=/tmp/empty-global.npmrc -e NPM_CONFIG_AUDIT=false -e NPM_CONFIG_FUND=false -e SWC_NATIVE_BINDING_CACHE=/subject/node_modules/.cache/swc-native "$NODE_IMAGE" bash -euo pipefail -s <<'LIFECYCLE'
          test ! -e /subject/.git/HEAD
          test ! -e /subject/.git/config
          test "$(ls /sys/class/net)" = lo
          test ! -L node_modules
          test ! -L node_modules/.cache
          test ! -L node_modules/.cache/swc-native
          mkdir -p "$HOME" "$NPM_CONFIG_CACHE" node_modules/.cache/swc-native
          chmod 0700 node_modules/.cache/swc-native
          test "$(stat -c %u node_modules/.cache/swc-native)" = "$(id -u)"
          test "$(stat -c %a node_modules/.cache/swc-native)" = 700
          touch /tmp/empty-user.npmrc /tmp/empty-global.npmrc
          node --version
          npm --version
          npm rebuild --offline --ignore-scripts=false --foreground-scripts
          HUSKY=0 npm run prepare --offline --ignore-scripts=false
          # Rebuild exit zero alone cannot prove native/fallback loading.
          node <<'NATIVE'
          const assert = require("node:assert/strict");
          const path = require("node:path");
          const root = process.cwd();
          for (const subpath of ["esbuild", "tsx/node_modules/esbuild", "vite/node_modules/esbuild", "@esbuild-kit/core-utils/node_modules/esbuild"]) {
            const tool = require(path.join(root, "node_modules", subpath));
            const result = tool.transformSync("const value: number = 1", {loader: "ts"});
            assert.equal(typeof result.code, "string");
            assert.ok(result.code.includes("value"));
          }
          for (const subpath of ["@swc/core", "next-intl/node_modules/@swc/core"]) {
            const tool = require(path.join(root, "node_modules", subpath));
            const result = tool.transformSync("const value: number = 1", {jsc: {parser: {syntax: "typescript"}}});
            assert.equal(typeof result.code, "string");
            assert.ok(result.code.includes("value"));
          }
          const rollup = require(path.join(root, "node_modules/rollup/dist/native.js"));
          assert.equal(typeof rollup.parseAsync, "function");
          assert.equal(typeof require("@parcel/watcher").subscribe, "function");
          (async () => {
            for (const subpath of ["sharp", "@storybook/nextjs/node_modules/sharp"]) {
              const sharp = require(path.join(root, "node_modules", subpath));
              const image = await sharp({create: {width: 1, height: 1, channels: 3, background: "white"}}).png().toBuffer();
              assert.ok(image.length > 0);
            }
          })().catch(error => {console.error(error.message); process.exitCode = 1});
          NATIVE
          LIFECYCLE
          assert_git_metadata
          sha256sum --check "$RUNNER_TEMP/booking-git-metadata.sha256"
          sha256sum --check "$RUNNER_TEMP/booking-inputs.sha256"
          sha256sum --check "$RUNNER_TEMP/booking-source.sha256" > /dev/null
          test "$(safe_git rev-parse HEAD)" = "$SUBJECT_SHA"
          test -z "$(safe_git status --porcelain)"
          # Official package command; no database or provider service is started.
          timeout 100s docker run --user "$(id -u):$(id -g)" --rm --cidfile "$owned/types.cid" --label "luster-driver-owner=$owner" --network=none --cap-drop=ALL --security-opt=no-new-privileges --read-only --tmpfs /tmp:rw --memory=4g --memory-swap=4g --cpus=2 --pids-limit=256 --mount "type=bind,src=$PWD,dst=/subject" --tmpfs /subject/.git:ro,noexec,nosuid,nodev,mode=000 -w /subject -e CI=true -e HUSKY=0 -e HOME=/tmp/isolated-home -e NPM_CONFIG_CACHE=/tmp/isolated-npm-cache -e NPM_CONFIG_USERCONFIG=/tmp/empty-user.npmrc -e NPM_CONFIG_GLOBALCONFIG=/tmp/empty-global.npmrc -e SWC_NATIVE_BINDING_CACHE=/subject/node_modules/.cache/swc-native -e NODE_OPTIONS=--max-old-space-size=3072 -e NEXT_TELEMETRY_DISABLED=1 -e BILLING_PLAN_ENV=test -e CLERK_SECRET_KEY=ci-placeholder-not-a-secret -e NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Y2kubHVzdGVyLmludmFsaWQk -e NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in -e STRIPE_SECRET_KEY=ci-placeholder-not-a-secret -e STRIPE_WEBHOOK_SECRET=ci-placeholder-not-a-secret -e STRIPE_CONNECT_WEBHOOK_SECRET=ci-placeholder-not-a-secret -e NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=ci-placeholder-not-a-secret "$NODE_IMAGE" bash -euo pipefail -c 'test ! -e /subject/.git/HEAD; test ! -e /subject/.git/config; test "$(ls /sys/class/net)" = lo; mkdir -p "$HOME" "$NPM_CONFIG_CACHE"; touch /tmp/empty-user.npmrc /tmp/empty-global.npmrc; node --version; npm run check-types'
          assert_git_metadata
          sha256sum --check "$RUNNER_TEMP/booking-git-metadata.sha256"
          sha256sum --check "$RUNNER_TEMP/booking-inputs.sha256"
          sha256sum --check "$RUNNER_TEMP/booking-source.sha256" > /dev/null
          test "$(safe_git rev-parse HEAD)" = "$SUBJECT_SHA"
          test -z "$(safe_git status --porcelain)"
          printf 'EXACT_OFFICIAL_TYPECHECK_PASSED subject=%s source_unchanged=true\n' "$SUBJECT_SHA"
